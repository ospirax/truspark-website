<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="theme-color" content="#783FAA" />

    <!-- Static markup rather than set from JS, so scrapers that do not run
         JavaScript still read the title and link preview tags. -->
    <title>TruSpark — Individualised Learning Support for Children</title>
    <meta
      name="description"
      content="TruSpark identifies what is getting in the way of a child's learning and provides targeted, individualised academic, behavioural and emotional support, with measurable progress over 3–6 months. For families and schools."
    />
    <meta
      name="keywords"
      content="learning difficulties, learning assessment for children, academic support, memory and concentration, reading and writing difficulty, CBT for children, school partnerships"
    />

    <!-- The live domain. WhatsApp, LinkedIn and Facebook reject a relative
         og:image, so these three must be absolute URLs. If the domain is ever
         anything other than truspark.in, change it in all four places below. -->
    <link rel="canonical" href="https://truspark.in/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://truspark.in/" />
    <meta property="og:site_name" content="TruSpark" />
    <meta property="og:title" content="TruSpark — For a Limitless Tomorrow" />
    <meta
      property="og:description"
      content="When learning feels hard, the right support changes everything. Individualised academic, behavioural and emotional support for children, with measurable progress."
    />
    <meta property="og:image" content="https://truspark.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="TruSpark — When Learning Feels Hard, the Right Support Changes Everything."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TruSpark — For a Limitless Tomorrow" />
    <meta
      name="twitter:description"
      content="When learning feels hard, the right support changes everything. Individualised academic, behavioural and emotional support for children, with measurable progress."
    />
    <meta name="twitter:image" content="https://truspark.in/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
